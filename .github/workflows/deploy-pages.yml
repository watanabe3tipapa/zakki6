name: Validate and deploy Quarto site

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # 23:00 UTC = 08:00 JST on the following day.
    - cron: "0 23 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.classify.outputs.should_deploy }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "Scheduled daily feed refresh requested."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Deployment decision"
              echo
              echo "- Trigger: daily scheduled feed refresh (08:00 JST)"
              echo "- Decision: check official feeds before publishing"
              echo "- Reason: only changed feed content will be deployed"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual execution requested."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Deployment decision"
              echo
              echo "- Trigger: manual workflow dispatch"
              echo "- Decision: deploy"
              echo "- Reason: manual execution bypasses file-change selection"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          base="${{ github.event.before }}"
          head="${{ github.sha }}"
          changed_files="$(mktemp)"

          if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
            git diff-tree --no-commit-id --name-only -r "$head" > "$changed_files"
          else
            git diff --name-only "$base" "$head" > "$changed_files"
          fi

          echo "Changed files:"
          cat "$changed_files"

          # Site source and configuration files are eligible for deployment.
          # Generated files such as .html, .aux, .log and .tex are intentionally excluded.
          site_change_pattern='^(_quarto\.yml|CNAME|\.nojekyll|styles\.css|[^/]+\.qmd|assets/|books/|_includes/|scripts/build_external_feeds\.py|.*/[^/]+\.(qmd|md|png|jpe?g|gif|svg|webp|css|js|json|bib|csl|ya?ml)|\.github/workflows/deploy-pages\.yml)$'

          if grep -Eq "$site_change_pattern" "$changed_files"; then
            decision="deploy"
            reason="site-affecting change detected"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            decision="skip"
            reason="no site-affecting change detected"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "## Deployment decision"
            echo
            echo "- Trigger: push to main"
            echo "- Decision: $decision"
            echo "- Reason: $reason"
            echo
            echo "### Changed files"
            sed 's/^/- `/' "$changed_files" | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  validate-and-build:
    needs: classify-changes
    if: needs.classify-changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.feed-change.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: Check source changes for whitespace errors
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: git diff --check "${{ github.event.before }}" "${{ github.sha }}"

      - name: Refresh official external feeds
        id: feed-change
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_external_feeds.py
          changed="$(sed -n 's/^changed=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          {
            echo "## External feed refresh"
            echo
            echo "- TREND: MdN Design Interactive official RSS"
            echo "- ANTENNA: Digital Agency official RSS"
            echo "- Feed content changed: $changed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Render and validate Quarto site
        if: steps.feed-change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          quarto render --to html 2>&1 | tee quarto-render.log
          test -s _docs/index.html
          if grep -Eq '^(WARN(ING)?|ERROR)(:|[[:space:]])' quarto-render.log; then
            echo "Quarto emitted diagnostics that must be resolved before deployment."
            exit 1
          fi

      - name: Configure GitHub Pages
        if: steps.feed-change.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.feed-change.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_docs

  deploy:
    needs:
      - classify-changes
      - validate-and-build
    if: needs.classify-changes.outputs.should_deploy == 'true' && needs.validate-and-build.result == 'success' && needs.validate-and-build.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
